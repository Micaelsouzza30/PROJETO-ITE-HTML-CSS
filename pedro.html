
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Alimentos - Eco Ponto Solidário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Cadastrar Alimentos</h1>
        <p>Compartilhe alimentos e evite o desperdício!</p>
        <link rel="stylesheet" href="../css/style.css">
    </header>
<nav>
    <a href="../index.html">Início</a>
    <a href="micael.html">Solicitar coleta</a>
    <a href="pedro.html">Cadastrar alimentos</a>
    <a href="robson.html">Consultar doações</a>
    <a href="gabriel.html">Parceiros</a>
</nav>
    <main>
        <section>
            <h2>Cadastro de alimentos disponíveis</h2>

            <form>
                <label>Nome do alimento:</label>
                <input type="text" placeholder="Ex: Arroz">

                <label>Quantidade:</label>
                <input type="text" placeholder="Ex: 20 kg">

                <label>Data de validade:</label>
                <input type="date">

                <label>Localização:</label>
                <input type="text" placeholder="Digite o endereço">

                <label>Descrição do alimento:</label>
                <textarea rows="5" placeholder="Informações sobre o alimento"></textarea>

                <button type="button">Cadastrar alimento</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Eco Ponto Solidário</p>
    </footer>

</body>
</html>
