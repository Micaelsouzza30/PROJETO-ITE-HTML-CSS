
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Coleta - Eco Ponto Solidário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Solicitar Coleta</h1>
        <p>Ajude a levar alimentos a quem precisa!</p>
        <link rel="stylesheet" href="../css/style.css">
    </header>

<nav>
    <a href="../index.html">Início</a>
    <a href="micael.html">Solicitar coleta</a>
    <a href="pedro.html">Cadastrar alimentos</a>
    <a href="robson.html">Consultar doações</a>
    <a href="gabriel.html">Parceiros</a>
</nav>

    <main>
        <section>
            <h2>Formulário de solicitação</h2>

            <form>
                <label>Nome completo:</label>
                <input type="text" placeholder="Digite seu nome">

                <label>Telefone:</label>
                <input type="tel" placeholder="Digite seu telefone">

                <label>Endereço:</label>
                <input type="text" placeholder="Digite seu endereço">

                <label>Tipo de alimento:</label>
                <input type="text" placeholder="Ex: arroz, feijão, frutas">

                <label>Quantidade disponível:</label>
                <input type="text" placeholder="Ex: 10 kg">

                <label>Descrição:</label>
                <textarea rows="5" placeholder="Descreva os alimentos disponíveis"></textarea>

                <button type="button">Solicitar coleta</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Eco Ponto Solidário</p>
    </footer>

</body>
</html>
